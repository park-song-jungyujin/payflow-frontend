name: Deploy payflow-web

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # WIF — 키 없이 이 토큰으로 GCP에 인증한다

env:
  PROJECT_ID: payflow-hackathon-2026
  REGION: asia-northeast3
  # backend/infra의 terraform output ci_web_workload_identity_provider / ci_web_deployer_service_account
  WIF_PROVIDER: projects/1095757595735/locations/global/workloadIdentityPools/github-actions/providers/payflow-frontend
  DEPLOY_SA: payflow-web-deployer@payflow-hackathon-2026.iam.gserviceaccount.com
  RUNTIME_SA: payflow-web@payflow-hackathon-2026.iam.gserviceaccount.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # next build가 .next/types를 생성한다 — typecheck가 LayoutProps 같은 라우트 타입을
      # 보려면 build가 먼저 돌아야 한다.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # NEXT_PUBLIC_*는 next build 시점에 클라이언트 번들에 굽힌다 — Cloud Run의
      # --set-env-vars(런타임 주입)는 이미 빌드된 번들에 아무 효과가 없다. client
      # id는 비밀이 아니지만(브라우저 리다이렉트 URL에 그대로 노출) Secret
      # Manager에 이미 있는 값을 이중 관리하지 않으려고 여기서 읽는다 — web
      # deployer SA는 GOOGLE_CLIENT_ID 하나만 읽을 권한이 있다(infra/iam.tf).
      - id: client_id
        run: |
          VALUE=$(gcloud secrets versions access latest --secret=GOOGLE_CLIENT_ID --project="$PROJECT_ID")
          echo "::add-mask::$VALUE"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      # PUBLIC_APP_URL: Cloud Run 컨테이너 내부에서 req.nextUrl.origin이
      # http://localhost:8080(내부 바인딩 주소)로 나와서, 로그인 페이지가
      # window.location.origin으로 Google에 보낸 redirect_uri와 서버가 재계산한
      # 값이 달라져 redirect_uri_mismatch가 났다(google/callback/route.ts).
      # 이 서비스 자신의 URL은 이름·프로젝트·리전이 고정이라 배포마다 그대로다.
      - run: |
          gcloud run deploy payflow-web \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-build-env-vars "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ steps.client_id.outputs.value }}" \
            --update-env-vars "PUBLIC_APP_URL=https://payflow-web-1095757595735.asia-northeast3.run.app,API_BASE_URL=https://payflow-api-1095757595735.asia-northeast3.run.app" \
            --quiet
